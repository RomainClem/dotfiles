# Update the prefix to an option easier to use
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix # Press C-Space twice for a literal C-Space

# Enable mouse selection
set -g mouse on

# Plugins are managed by TPM (cloned by run_onchange_after_06-install-tmux-plugins.sh).
# After adding a plugin here, `chezmoi apply` installs it; inside tmux, prefix + I does too.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: prefix + Ctrl-s saves, prefix + Ctrl-r restores
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: save every 15 minutes, restore the last save when the tmux server starts.
# Continuum hooks its autosave into status-right, so any theme that overwrites
# status-right must be loaded above this point.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
